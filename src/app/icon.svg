<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Technical Navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E1E" />
      <stop offset="45%" stop-color="#0F1B38" />
      <stop offset="100%" stop-color="#050B14" />
    </linearGradient>

    <!-- Top Facet: Horizon / Sky Daylight -->
    <linearGradient id="topFacet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#7DD3FC" />
    </linearGradient>

    <!-- Left Facet: Structural Cobalt -->
    <linearGradient id="leftFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Right Facet: Depth / Subterranean Indigo -->
    <linearGradient id="rightFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#0A1026" />
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Ambient Core Lighting -->
  <circle cx="256" cy="256" r="220" fill="url(#ambientGlow)" />

  <!-- Subtle Precision Border -->
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="4" />

  <!-- The Profundidade Isometric Prism (Exact 30-degree isometric projection) -->
  <g id="prism">
    <!-- Top Face (Plan / Surface View) -->
    <polygon points="256,106 386,181 256,256 126,181" fill="url(#topFacet)" />

    <!-- Left Face (Elevation / Structural Face) -->
    <polygon points="126,181 256,256 256,406 126,331" fill="url(#leftFacet)" />

    <!-- Right Face (Depth / Foundation Face) -->
    <polygon points="256,256 386,181 386,331 256,406" fill="url(#rightFacet)" />

    <!-- Intermediate Depth Level Strata Lines -->
    <polyline points="126,256 256,331 386,256" fill="none" stroke="#60A5FA" stroke-width="5" stroke-opacity="0.6" stroke-dasharray="10 8" />

    <!-- Outer Contour Highlights -->
    <polygon points="256,106 386,181 386,331 256,406 126,331 126,181" fill="none" stroke="#93C5FD" stroke-width="7" stroke-linejoin="round" />

    <!-- Central Vertical Depth Axis (Plumb-line / Profundidade Axis) -->
    <line x1="256" y1="106" x2="256" y2="406" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-dasharray="14 10" />

    <!-- Facet Horizon Dividers -->
    <line x1="126" y1="181" x2="256" y2="256" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.4" />
    <line x1="256" y1="256" x2="386" y2="181" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.4" />

    <!-- Central Precision Node (Surveying Datum Point) -->
    <circle cx="256" cy="256" r="32" fill="#0284C7" fill-opacity="0.3" />
    <circle cx="256" cy="256" r="24" fill="#070D1E" stroke="#38BDF8" stroke-width="6" />
    <circle cx="256" cy="256" r="10" fill="#FFFFFF" />
  </g>
</svg>
